<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anyworld 运维面板</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; --bg: #0b1212; --panel: #141f20; --text: #e0e9e5;
      --muted: #9aaca8; --border: rgb(216 224 231 / 12%); --accent: #7bc9ab; --error: #ff7b72; }
    body { max-width: 30rem; margin: 4rem auto; padding: 0 1rem; background: var(--bg);
      color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
    .card { padding: 2rem; border: 1px solid var(--border); border-radius: 1rem;
      background: var(--panel); }
    h1 { font-size: 1.4rem; margin: 0 0 1.5rem; color: var(--accent); }
    label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.6rem 0.75rem; margin-bottom: 1rem; border: 1px solid
      var(--border); border-radius: 0.5rem; background: var(--bg); color: var(--text); }
    button { padding: 0.6rem 1.25rem; border: none; border-radius: 0.5rem;
      background: var(--accent); color: #05231a; font-weight: 600; cursor: pointer; }
    .error { color: var(--error); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anyworld 运维面板</h1>
    <p style="color:var(--muted)">请输入 admin 密码登录运维面板。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="password">Admin 密码</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">进入</button>
    </form>
  </div>
</body>
</html>
